<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Kata Sandi — Racik Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase-config.js"></script>
  <script src="../../api/auth.js"></script>
  <link rel="stylesheet" href="/assets/css/public-layout.css" />
</head>
<body class="flex min-h-screen items-center justify-center bg-emerald-50 px-4">
  <div id="rm-navbar-root"></div>
  <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
    <a href="login.html" class="text-sm font-semibold text-emerald-800 hover:underline">← Kembali ke login</a>
    <h1 class="mt-5 font-serif text-3xl font-bold">Reset kata sandi</h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">Masukkan email akun. Jika terdaftar, Supabase akan mengirimkan tautan reset.</p>
    <form id="resetRequestForm" class="mt-6 space-y-4">
      <label class="block text-sm font-semibold">Email<input id="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5"></label>
      <p id="message" class="hidden text-sm" role="status" aria-live="polite"></p>
      <button id="submitButton" class="w-full rounded-lg bg-emerald-800 px-4 py-3 text-sm font-bold text-white">Kirim tautan reset</button>
    </form>
  </main>
  <script>
    document.getElementById('resetRequestForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      var message = document.getElementById('message');
      var button = document.getElementById('submitButton');
      button.disabled = true;
      message.classList.remove('hidden', 'text-rose-700', 'text-emerald-800');
      try {
        await BobAuth.requestPasswordReset(document.getElementById('email').value.trim());
        message.textContent = 'Jika email tersebut terdaftar, tautan reset akan dikirim. Periksa juga folder spam.';
        message.classList.add('text-emerald-800');
      } catch (error) {
        message.textContent = error.message || 'Permintaan reset gagal. Coba kembali beberapa saat lagi.';
        message.classList.add('text-rose-700');
      } finally {
        message.classList.remove('hidden');
        button.disabled = false;
      }
    });
  </script>
  <script src="../../assets/js/lang.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/public-layout.js"></script>
</body>
</html>
