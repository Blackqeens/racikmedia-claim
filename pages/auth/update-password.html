<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buat Kata Sandi Baru — Racik Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase-config.js"></script>
  <script src="../../api/auth.js"></script>
  <link rel="stylesheet" href="/assets/css/public-layout.css" />
</head>
<body class="flex min-h-screen items-center justify-center bg-emerald-50 px-4">
  <div id="rm-navbar-root"></div>
  <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
    <a href="login.html" class="text-sm font-semibold text-emerald-800 hover:underline">← Kembali ke login</a>
    <h1 class="mt-5 font-serif text-3xl font-bold">Buat kata sandi baru</h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">Tautan reset hanya berlaku sesuai masa aktif yang diatur di Supabase Auth.</p>
    <form id="updatePasswordForm" class="mt-6 space-y-4">
      <label class="block text-sm font-semibold">Kata sandi baru<input id="password" type="password" autocomplete="new-password" minlength="8" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5"></label>
      <label class="block text-sm font-semibold">Ulangi kata sandi<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5"></label>
      <p id="message" class="hidden text-sm" role="status" aria-live="polite"></p>
      <button id="submitButton" class="w-full rounded-lg bg-emerald-800 px-4 py-3 text-sm font-bold text-white">Simpan kata sandi</button>
    </form>
  </main>
  <script>
    (async function () {
      var message = document.getElementById('message');
      var button = document.getElementById('submitButton');
      button.disabled = true;
      try {
        var client = await BobAuth.getClient();
        var auth = await client.auth.getUser();
        if (auth.error) throw auth.error;
        if (!auth.data.user) throw new Error('Tautan reset tidak valid atau sudah kedaluwarsa. Minta tautan reset baru.');
        button.disabled = false;
      } catch (error) {
        message.textContent = error.message || 'Tautan reset tidak dapat diverifikasi.';
        message.classList.remove('hidden');
        message.classList.add('text-rose-700');
      }
    })();

    document.getElementById('updatePasswordForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      var password = document.getElementById('password').value;
      var confirmation = document.getElementById('confirmPassword').value;
      var message = document.getElementById('message');
      var button = document.getElementById('submitButton');
      if (password !== confirmation) {
        message.textContent = 'Konfirmasi kata sandi tidak cocok.';
        message.classList.remove('hidden', 'text-emerald-800');
        message.classList.add('text-rose-700');
        return;
      }
      button.disabled = true;
      var passwordUpdated = false;
      try {
        await BobAuth.updatePassword(password);
        passwordUpdated = true;
        var client = await BobAuth.getClient();
        var signOut = await client.auth.signOut();
        if (signOut.error) throw signOut.error;
        message.textContent = 'Kata sandi berhasil diperbarui. Silakan masuk menggunakan kata sandi baru.';
        message.classList.remove('hidden', 'text-rose-700');
        message.classList.add('text-emerald-800');
        window.setTimeout(function () { window.location.replace('login.html'); }, 1800);
      } catch (error) {
        message.textContent = passwordUpdated
          ? 'Kata sandi sudah diperbarui, tetapi sesi belum berhasil ditutup. Silakan keluar dari sesi secara manual.'
          : (error.message || 'Kata sandi gagal diperbarui.');
        message.classList.remove('hidden', 'text-emerald-800');
        message.classList.add('text-rose-700');
        button.disabled = false;
      }
    });
  </script>
  <script src="../../assets/js/lang.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/public-layout.js"></script>
</body>
</html>
