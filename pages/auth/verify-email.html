<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirim Ulang Konfirmasi Email — Racik Media</title>
  <script src="../../api/auth.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/public-layout.css" />
</head>
<body class="flex min-h-screen items-center justify-center bg-emerald-50 px-4">
  <div id="rm-navbar-root"></div>
  <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
    <a href="login.html" class="text-sm font-semibold text-emerald-800 hover:underline">← Kembali ke login</a>
    <h1 class="mt-5 font-serif text-3xl font-bold">Konfirmasi email</h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">Masukkan email pendaftaran untuk meminta ulang tautan konfirmasi.</p>
    <form id="confirmationForm" class="mt-6 space-y-4">
      <label class="block text-sm font-semibold">Email<input id="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5"></label>
      <p id="message" class="hidden text-sm" role="status" aria-live="polite"></p>
      <button id="submitButton" class="w-full rounded-lg bg-emerald-800 px-4 py-3 text-sm font-bold text-white">Kirim ulang email</button>
    </form>
  </main>
  <script>
    document.getElementById('confirmationForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      var message = document.getElementById('message');
      var button = document.getElementById('submitButton');
      button.disabled = true;
      try {
        await BobAuth.resendConfirmation(document.getElementById('email').value.trim());
        message.textContent = 'Jika email tersebut menunggu konfirmasi, tautan baru akan dikirim. Periksa folder spam.';
        message.classList.remove('text-rose-700');
        message.classList.add('text-emerald-800');
      } catch (error) {
        message.textContent = error.message || 'Email konfirmasi gagal dikirim. Coba lagi nanti.';
        message.classList.remove('text-emerald-800');
        message.classList.add('text-rose-700');
      } finally {
        message.classList.remove('hidden');
        button.disabled = false;
      }
    });
  </script>
  <script src="../../assets/js/lang.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/public-layout.js"></script>
</body>
</html>
