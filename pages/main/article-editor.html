<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tulis Artikel — BOB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
/* ── Toolbar ── */
    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky; top: 0; z-index: 40;
      padding: 0 20px;
      display: flex; align-items: center; gap: 2px;
      height: 48px;
      flex-wrap: wrap;
    }
    .toolbar-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border: none; background: none; border-radius: 6px;
      cursor: pointer; color: #374151;
      font-size: 13px; font-weight: 600;
      transition: background .12s, color .12s;
    }
    .toolbar-btn:hover { background: #f0fdf4; color: #047857; }
    .toolbar-btn.active { background: #ecfdf5; color: #047857; }
    .toolbar-sep { width: 1px; height: 20px; background: #e5e7eb; margin: 0 4px; flex-shrink: 0; }

    /* ── Title input ── */
    #editor-title {
      width: 100%;
      border: none; outline: none; background: transparent;
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 700;
      color: #1f2328;
      line-height: 1.25;
      resize: none;
      padding: 0;
      overflow: hidden;
    }
    #editor-title::placeholder { color: #d1d5db; }

    /* ── Body editor ── */
    #editor-body {
      width: 100%;
      min-height: 400px;
      border: none; outline: none; background: transparent;
      font-family: 'Lora', Georgia, serif;
      font-size: 17px;
      line-height: 1.8;
      color: #374151;
      resize: none;
    }
    #editor-body::placeholder { color: #d1d5db; }

    /* ── Word count bar ── */
    .word-bar {
      background: #fff; border-top: 1px solid #e5e7eb;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 8px 24px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: #9ca3af; z-index: 40;
    }

    /* ── Cover image drop zone ── */
    .cover-zone {
      border: 2px dashed #e5e7eb;
      border-radius: 10px;
      height: 140px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .cover-zone:hover { border-color: #34d399; background: #f0fdf4; }
    .cover-zone.has-image { border: none; padding: 0; overflow: hidden; }
    .cover-zone.has-image img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; }

    /* ── Save status ── */
    #save-status { font-size: 12px; color: #9ca3af; transition: color .3s; }
    #save-status.saved { color: #22c55e; }
    #save-status.saving { color: #f59e0b; }
  </style>
  <link rel="stylesheet" href="/assets/css/public-layout.css" />
</head>

<body class="min-h-screen flex flex-col">
  <div id="rm-navbar-root"></div>

<!-- ══════════════════════════════════════
     TOPBAR
     ══════════════════════════════════════ -->
<div style="background:#fff;border-bottom:1px solid #e5e7eb;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;">

  <!-- Left: back + title -->
  <div class="flex items-center gap-3">
    <a href="dashboard.html" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#6b7280;text-decoration:none;" class="hover:text-emerald-700 transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Kembali
    </a>
    <span style="width:1px;height:18px;background:#e5e7eb;"></span>
    <a href="dashboard.html" style="text-decoration:none;">
      <img src="../../assets/brand/1.png" alt="Racik Media" style="height:28px;width:auto;" />
    </a>
    <span style="font-size:12px;font-weight:600;color:#047857;letter-spacing:.04em;">Editor</span>
  </div>

  <!-- Right: type selector + actions -->
  <div class="flex items-center gap-2">
    <!-- Article type badge -->
    <select id="article-type" style="font-size:12px;font-weight:600;border:1px solid #e5e7eb;border-radius:6px;padding:4px 8px;color:#374151;background:#fff;cursor:pointer;outline:none;">
      <option value="artikel">📝 Artikel</option>
      <option value="catatan">📖 Catatan Buku</option>
      <option value="ulasan">⭐ Ulasan Produk</option>
      <option value="jurnal">🌿 Jurnal Harian</option>
    </select>

    <!-- Save status -->
    <span id="save-status">Belum disimpan</span>

    <!-- Save draft -->
    <button onclick="saveDraft()" style="font-size:12px;font-weight:600;padding:6px 14px;border:1px solid #e5e7eb;border-radius:7px;background:#fff;color:#374151;cursor:pointer;" class="hover:border-emerald-300 hover:text-emerald-700 transition-colors">
      Simpan Draft
    </button>

    <!-- Publish -->
    <button onclick="publish()" style="font-size:12px;font-weight:700;padding:6px 16px;border:none;border-radius:7px;background:linear-gradient(135deg,#34d399,#38bdf8);color:#064e3b;cursor:pointer;" class="hover:opacity-90 transition-opacity">
      Terbitkan
    </button>
  </div>

</div>

<!-- ══════════════════════════════════════
     FORMATTING TOOLBAR
     ══════════════════════════════════════ -->
<div class="toolbar">
  <button class="toolbar-btn" title="Bold" onclick="fmt('bold')"><b>B</b></button>
  <button class="toolbar-btn" title="Italic" onclick="fmt('italic')"><i>I</i></button>
  <button class="toolbar-btn" title="Underline" onclick="fmt('underline')"><u>U</u></button>
  <button class="toolbar-btn" title="Strikethrough" onclick="fmt('strikeThrough')"><s>S</s></button>
  <div class="toolbar-sep"></div>
  <button class="toolbar-btn" title="Heading 2" onclick="fmt('formatBlock','h2')" style="font-size:11px;font-weight:700;">H2</button>
  <button class="toolbar-btn" title="Heading 3" onclick="fmt('formatBlock','h3')" style="font-size:11px;font-weight:700;">H3</button>
  <button class="toolbar-btn" title="Paragraf" onclick="fmt('formatBlock','p')" style="font-size:11px;">¶</button>
  <div class="toolbar-sep"></div>
  <button class="toolbar-btn" title="Bullet list" onclick="fmt('insertUnorderedList')">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
  </button>
  <button class="toolbar-btn" title="Ordered list" onclick="fmt('insertOrderedList')">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
  </button>
  <button class="toolbar-btn" title="Blockquote" onclick="fmt('formatBlock','blockquote')" style="font-size:14px;">"</button>
  <div class="toolbar-sep"></div>
  <button class="toolbar-btn" title="Sisipkan gambar" onclick="insertImage()">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
  </button>
  <button class="toolbar-btn" title="Sisipkan tautan" onclick="insertLink()">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
  </button>
  <div class="toolbar-sep"></div>
  <button class="toolbar-btn" title="Rata kiri" onclick="fmt('justifyLeft')">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"/></svg>
  </button>
  <button class="toolbar-btn" title="Tengah" onclick="fmt('justifyCenter')">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M8 12h8M4 18h16"/></svg>
  </button>
</div>

<!-- ══════════════════════════════════════
     EDITOR CANVAS
     ══════════════════════════════════════ -->
<main class="flex-1 w-full max-w-3xl mx-auto px-6 py-8 pb-20 flex flex-col gap-5">

  <!-- Cover image zone -->
  <div class="cover-zone" id="cover-zone" onclick="document.getElementById('cover-input').click()" title="Klik untuk unggah gambar sampul">
    <svg class="w-8 h-8 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    <p style="font-size:13px;color:#9ca3af;font-weight:500;">Tambah gambar sampul (opsional)</p>
    <input type="file" id="cover-input" accept="image/*" style="display:none;" onchange="previewCover(event)" />
  </div>

  <!-- Category & tags row -->
  <div class="flex items-center gap-3 flex-wrap">
    <select id="category" style="font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:5px 10px;color:#374151;background:#fff;outline:none;cursor:pointer;">
      <option value="">— Pilih Kategori —</option>
      <option>Agrikultur</option>
      <option>Kuliner</option>
      <option>Kerajinan</option>
      <option>Budaya</option>
      <option>Sosial</option>
      <option>Lingkungan</option>
      <option>Wisata</option>
      <option>Ekonomi Lokal</option>
    </select>
    <input type="text" id="tags-input" placeholder="Tambah tag (pisah dengan koma)…"
           style="font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:5px 10px;color:#374151;outline:none;flex:1;min-width:160px;"
           onfocus="this.style.borderColor='#34d399'" onblur="this.style.borderColor='#e5e7eb'" />
  </div>

  <!-- Divider -->
  <div style="border-top:1px solid #e5e7eb;"></div>

  <!-- Title -->
  <textarea id="editor-title" rows="1" placeholder="Judul tulisanmu…" oninput="autoResize(this);updateWordCount();markDirty()" maxlength="160"></textarea>

  <!-- Byline -->
  <p style="font-size:13px;color:#9ca3af;" id="byline-text">
    oleh <strong id="byline-name" style="color:#374151;">—</strong>
    &nbsp;·&nbsp; <span id="byline-date"></span>
    &nbsp;·&nbsp; <span id="read-time">0 mnt baca</span>
  </p>

  <!-- Body editor (contenteditable) -->
  <div id="editor-body" contenteditable="true" spellcheck="true"
       style="min-height:400px;font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.8;color:#374151;outline:none;"
       data-placeholder="Mulai menulis di sini…"
       oninput="updateWordCount();markDirty()">
  </div>

</main>

<!-- ══════════════════════════════════════
     WORD COUNT BAR
     ══════════════════════════════════════ -->
<div class="word-bar">
  <span id="word-count">0 kata</span>
  <span id="char-count">0 karakter</span>
  <span>Draft otomatis tersimpan setiap 30 detik</span>
</div>

<style>
  /* Placeholder for contenteditable */
  #editor-body:empty:before {
    content: attr(data-placeholder);
    color: #d1d5db;
    pointer-events: none;
  }
  /* Blockquote styling */
  #editor-body blockquote {
    border-left: 3px solid #34d399;
    padding-left: 16px;
    color: #6b7280;
    font-style: italic;
    margin: 8px 0;
  }
  #editor-body h2 { font-family: 'Lora',serif; font-size: 22px; font-weight: 700; margin: 16px 0 4px; color: #1f2328; }
  #editor-body h3 { font-family: 'Lora',serif; font-size: 18px; font-weight: 600; margin: 12px 0 4px; color: #1f2328; }
  #editor-body a  { color: #047857; text-decoration: underline; }
</style>

<script>
  // ── Auto-resize textarea ──
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // ── Format command ──
  function fmt(cmd, val) {
    document.execCommand(cmd, false, val || null);
    document.getElementById('editor-body').focus();
    updateWordCount();
    markDirty();
  }

  // ── Insert image via URL ──
  function insertImage() {
    const url = prompt('URL gambar:');
    if (url) fmt('insertImage', url);
  }

  // ── Insert link ──
  function insertLink() {
    const url = prompt('URL tautan:', 'https://');
    if (url) fmt('createLink', url);
  }

  // ── Cover preview ──
  function previewCover(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const zone = document.getElementById('cover-zone');
      zone.innerHTML = '<img src="' + ev.target.result + '" alt="Cover" />';
      zone.classList.add('has-image');
    };
    reader.readAsDataURL(file);
  }

  // ── Word & char count ──
  function updateWordCount() {
    const title = document.getElementById('editor-title').value;
    const body  = document.getElementById('editor-body').innerText || '';
    const full  = (title + ' ' + body).trim();
    const words = full ? full.split(/\s+/).filter(Boolean).length : 0;
    const chars = full.length;

    document.getElementById('word-count').textContent = words + ' kata';
    document.getElementById('char-count').textContent = chars + ' karakter';

    // Estimate read time (~200 wpm)
    const mins = Math.max(1, Math.round(words / 200));
    document.getElementById('read-time').textContent = mins + ' mnt baca';
  }

  // ── Dirty flag + auto-save every 30s ──
  var _dirty = false;
  function markDirty() {
    _dirty = true;
    const el = document.getElementById('save-status');
    el.textContent = 'Belum disimpan';
    el.className   = '';
  }

  function saveDraft() {
    const data = {
      title:    document.getElementById('editor-title').value,
      body:     document.getElementById('editor-body').innerHTML,
      type:     document.getElementById('article-type').value,
      category: document.getElementById('category').value,
      tags:     document.getElementById('tags-input').value,
      savedAt:  new Date().toISOString(),
    };
    localStorage.setItem('bob_draft_article', JSON.stringify(data));
    _dirty = false;
    const el = document.getElementById('save-status');
    el.textContent = 'Tersimpan ✓';
    el.className   = 'saved';
    setTimeout(function() {
      if (!_dirty) { el.textContent = 'Draft tersimpan'; }
    }, 2500);
  }

  function publish() {
    saveDraft();
    alert('Artikel siap diterbitkan!\n\n[Hubungkan ke endpoint: POST /api/articles]');
  }

  // Auto-save every 30 seconds if dirty
  setInterval(function() { if (_dirty) saveDraft(); }, 30000);

  // ── Restore draft from localStorage ──
  (function() {
    const saved = localStorage.getItem('bob_draft_article');
    if (saved) {
      try {
        const d = JSON.parse(saved);
        if (d.title) { document.getElementById('editor-title').value = d.title; autoResize(document.getElementById('editor-title')); }
        if (d.body)  document.getElementById('editor-body').innerHTML = d.body;
        if (d.type)  document.getElementById('article-type').value = d.type;
        if (d.category) document.getElementById('category').value = d.category;
        if (d.tags)  document.getElementById('tags-input').value = d.tags;
        const el = document.getElementById('save-status');
        if (d.savedAt) {
          const dt = new Date(d.savedAt);
          el.textContent = 'Draft: ' + dt.toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'});
          el.className = 'saved';
        }
        updateWordCount();
      } catch(e) {}
    }
  })();

  // ── Set byline from sessionStorage ──
  (function() {
    const name = sessionStorage.getItem('bob_user_name') || 'Pengguna';
    const el   = document.getElementById('byline-name');
    if (el) el.textContent = name;

    const dateEl = document.getElementById('byline-date');
    if (dateEl) {
      dateEl.textContent = new Date().toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'});
    }
  })();
</script>

  <script src="../../assets/js/lang.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/public-layout.js"></script>
</body>
</html>
