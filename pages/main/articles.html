<!doctype html>
<html lang="id" class="scroll-smooth public-layout-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jelajah Jurnal — BOB · Racik Media Nusantara</title>
  <meta name="description" content="Jelajahi artikel tentang produk lokal Indonesia, budaya, agrikultur, kerajinan, dan lingkungan.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/shared.css">
  <link rel="stylesheet" href="../../assets/css/lang.css">
  <link rel="stylesheet" href="../../assets/css/public-layout.css">
  <script src="../../api/auth.js"></script>
  <script src="../../assets/js/public-articles.js"></script>
</head>
<body class="bg-white text-gray-900 antialiased public-layout-page">
  <div id="rm-navbar-root"></div>
  <section class="public-hero public-hero--journal bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 text-white">
    <div class="public-hero-pattern"></div>
    <div class="public-hero__content px-4">
      <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-emerald-500/40 bg-emerald-700/60 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-emerald-200">
        <span aria-hidden="true">✦</span> Jurnal Bacaan
      </div>
      <h1 class="mb-4 font-serif text-3xl font-bold tracking-tight sm:text-4xl lg:text-5xl">Jelajah Artikel</h1>
      <p class="mx-auto max-w-2xl font-sans text-sm font-light leading-relaxed text-emerald-100 sm:text-base">Temukan cerita dan wawasan dari para penulis Racik Media.</p>
      <a href="bookmarks.html" class="mt-6 inline-flex rounded-full border border-white/30 bg-white/10 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-white/20">Artikel tersimpan</a>
    </div>
  </section>
  <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-10">
    <section class="space-y-4 py-6" aria-label="Filter artikel">
      <div>
        <h2 class="mb-2 text-xs font-bold uppercase tracking-wide text-gray-500">Kategori</h2>
        <div id="categoryFilters" class="flex flex-wrap gap-2" role="group" aria-label="Filter kategori artikel"></div>
      </div>
      <div>
        <h2 class="mb-2 text-xs font-bold uppercase tracking-wide text-gray-500">Tag</h2>
        <div id="tagFilters" class="flex flex-wrap gap-2" role="group" aria-label="Filter tag artikel"></div>
      </div>
    </section>

    <p id="articleMessage" class="mb-5 text-sm text-gray-600" role="status" aria-live="polite">Memuat artikel...</p>
    <section id="articleGrid" class="grid grid-cols-1 gap-x-8 gap-y-12 sm:grid-cols-2 lg:grid-cols-3" aria-label="Daftar artikel"></section>
    <nav id="pagination" class="mt-12 flex justify-center gap-2" aria-label="Halaman artikel"></nav>
  </main>
  <div id="rm-footer-root"></div>
  <script src="../../assets/js/lang.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/public-layout.js"></script>
  <script>
    (function () {
      var grid = document.getElementById('articleGrid');
      var message = document.getElementById('articleMessage');
      var categoryFilters = document.getElementById('categoryFilters');
      var tagFilters = document.getElementById('tagFilters');
      var pagination = document.getElementById('pagination');
      var params = new URLSearchParams(window.location.search);
      var state = { category: params.get('category') || '', tag: params.get('tag') || '', page: Math.max(1, Number(params.get('page')) || 1) };
      var categories = [];
      var tags = [];

      function escape(value) { return PublicArticles.escapeHtml(value); }
      function filterButton(label, value, active, kind) {
        var className = active
          ? 'rounded-full bg-emerald-800 px-3 py-1.5 text-xs font-semibold text-white'
          : 'rounded-full border border-gray-200 px-3 py-1.5 text-xs font-medium text-gray-600 hover:border-emerald-700 hover:text-emerald-700';
        return '<button type="button" class="' + className + '" data-filter-kind="' + kind + '" data-filter-value="' + escape(value) + '">' + escape(label) + '</button>';
      }
      function renderFilters() {
        categoryFilters.innerHTML = filterButton('Semua', '', !state.category, 'category') + categories.map(function (value) {
          return filterButton(value, value, state.category === value, 'category');
        }).join('');
        tagFilters.innerHTML = filterButton('Semua tag', '', !state.tag, 'tag') + tags.map(function (value) {
          return filterButton('#' + value, value, state.tag === value, 'tag');
        }).join('');
      }
      function renderArticles(articles) {
        if (!articles.length) {
          grid.innerHTML = '';
          message.textContent = 'Belum ada artikel yang cocok dengan filter ini.';
          return;
        }
        grid.innerHTML = articles.map(function (article) {
          var imageUrl = PublicArticles.safeImageUrl(article.cover_url);
          var image = imageUrl
            ? '<img src="' + escape(imageUrl) + '" alt="' + escape(article.title) + '" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy">'
            : '<div class="flex h-full items-center justify-center bg-emerald-50 text-4xl text-emerald-800" aria-hidden="true">✦</div>';
          var articleUrl = 'article-detail.html?id=' + encodeURIComponent(article.id);
          var authorUrl = 'author-profile.html?id=' + encodeURIComponent(article.author_id);
          return '<article class="group flex flex-col gap-3"><a href="' + articleUrl + '" class="aspect-[3/2] overflow-hidden rounded-md bg-gray-100">' + image + '</a><div class="flex flex-col gap-2"><a class="text-xs font-semibold uppercase tracking-widest text-emerald-700 hover:underline" href="articles.html?category=' + encodeURIComponent(article.category) + '">' + escape(article.category) + '</a><h2 class="font-serif text-xl font-semibold leading-snug group-hover:text-emerald-800"><a href="' + articleUrl + '">' + escape(article.title) + '</a></h2><p class="line-clamp-3 text-sm leading-relaxed text-gray-500">' + escape(article.excerpt) + '</p><div class="flex flex-wrap items-center gap-2 text-xs text-gray-400"><a href="' + authorUrl + '" class="font-medium text-gray-600 hover:text-emerald-800">' + escape(article.author_name) + '</a><span>·</span><time datetime="' + escape(article.published_at) + '">' + escape(PublicArticles.dateLabel(article.published_at)) + '</time></div><div class="flex flex-wrap gap-1">' + (article.tags || []).map(function (tag) {
            return '<a class="rounded-full bg-gray-100 px-2 py-1 text-xs text-gray-600 hover:bg-emerald-50 hover:text-emerald-800" href="articles.html?tag=' + encodeURIComponent(tag) + '">#' + escape(tag) + '</a>';
          }).join('') + '</div></div></article>';
        }).join('');
      }
      function renderPagination(result) {
        pagination.innerHTML = '';
        if (result.totalPages < 2) return;
        var firstPage = Math.max(1, state.page - 2);
        var lastPage = Math.min(result.totalPages, state.page + 2);
        for (var page = firstPage; page <= lastPage; page++) {
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = String(page);
          button.setAttribute('aria-current', page === state.page ? 'page' : 'false');
          button.className = page === state.page
            ? 'h-9 w-9 rounded-full bg-emerald-800 text-sm font-semibold text-white'
            : 'h-9 w-9 rounded-full border border-gray-200 text-sm text-gray-600 hover:border-emerald-700';
          button.addEventListener('click', function (selectedPage) {
            return function () { state.page = selectedPage; loadArticles(); };
          }(page));
          pagination.appendChild(button);
        }
      }
      async function loadArticles() {
        message.textContent = 'Memuat artikel...';
        try {
          var result = await PublicArticles.list({ category: state.category, tag: state.tag, page: state.page, limit: 9 });
          if (result.totalPages && state.page > result.totalPages) {
            state.page = result.totalPages;
            return loadArticles();
          }
          renderArticles(result.data);
          if (result.data.length) message.textContent = result.total + ' artikel ditemukan.';
          renderPagination(result);
          var next = new URL(window.location.href);
          ['category', 'tag', 'page'].forEach(function (key) { next.searchParams.delete(key); });
          if (state.category) next.searchParams.set('category', state.category);
          if (state.tag) next.searchParams.set('tag', state.tag);
          if (state.page > 1) next.searchParams.set('page', String(state.page));
          window.history.replaceState({}, '', next);
        } catch (error) {
          message.textContent = error.message || 'Artikel gagal dimuat.';
          message.classList.add('text-rose-700');
        }
      }
      document.addEventListener('click', function (event) {
        var button = event.target.closest('[data-filter-kind]');
        if (!button) return;
        state[button.dataset.filterKind] = button.dataset.filterValue;
        state.page = 1;
        renderFilters();
        loadArticles();
      });
      var filtersRequest = PublicArticles.categoriesAndTags().then(function (filters) {
        categories = filters.categories;
        tags = filters.tags;
        renderFilters();
      }).catch(function (error) {
        renderFilters();
        console.error('[Articles] Filter kategori/tag gagal dimuat:', error);
      });
      var articlesRequest = loadArticles();
      Promise.all([filtersRequest, articlesRequest]);
    })();
  </script>
</body>
</html>
